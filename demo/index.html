<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>TaskFlow — Work with evidence</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f7f8fa;color:#172433}main{max-width:1100px;margin:auto;padding:36px 24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dce2e8;padding-bottom:20px}header strong{font-size:24px}h1{font-size:32px;letter-spacing:-.8px;margin-top:42px}p{line-height:1.8;color:#526174}.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:28px;margin-top:30px}.panel{background:white;border:1px solid #dde3e9;border-radius:14px;padding:24px}h2{font-size:20px;line-height:1.7;margin:10px 0 20px}h3{font-size:15px}.status{color:#1d5cbd;background:#edf4ff;display:inline-block;padding:4px 10px;border-radius:5px;font-size:13px}dl{display:grid;grid-template-columns:100px 1fr;gap:14px;font-size:14px}dt{color:#68758a}dd{margin:0;overflow-wrap:anywhere}button{padding:10px 14px;border:1px solid #cdd7e3;border-radius:8px;background:white;cursor:pointer;font:inherit;font-size:13px;min-height:42px}button:hover{background:#edf4ff}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,textarea:focus-visible{outline:3px solid #3b82f6;outline-offset:3px}.primary{background:#2563eb;color:white;border-color:#2563eb}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}textarea{width:100%;font:inherit;font-size:14px;border:1px solid #cdd7e3;border-radius:8px;padding:12px;min-height:85px;margin-top:8px}label{font-size:14px}ol{padding-left:24px}li{margin:18px 0;font-size:14px}li small{display:block;color:#68758a;margin-top:4px}.notice{font-size:13px}.result{min-height:35px;color:#1e5cb3;font-size:14px;margin-top:15px}.error{color:#aa271f}.progress{border-left:3px solid #93b9f4;padding-left:12px}.meta{font-size:12px;color:#738093}@media(max-width:720px){.grid{grid-template-columns:1fr}main{padding:20px 14px}h1{font-size:26px}.panel{padding:18px}}
</style><main><header><strong>TaskFlow</strong><button data-action="reset">リセット</button></header><h1>AIに任せた仕事を、<br>「その後」まで追えるように。</h1><p>誰が引き受け、何を進め、何を待ち、何を根拠に終えたのか。<br>タスクの状態と追記型の記録を、一つのサービスで扱います。</p><p class="notice">公開用の操作デモです。架空のタスクをローカルSQLiteで処理します。外部のAIや運用APIへの接続はありません。</p><div class="grid"><section class="panel"><span class="status" id="status"></span><h2 id="title"></h2><dl><dt>担当</dt><dd id="agent"></dd><dt>待っていること</dt><dd id="blocker"></dd><dt>更新version</dt><dd id="version"></dd></dl><div class="actions"><button class="primary" data-action="claim">仕事を引き受ける</button><button data-action="progress">進捗を記録</button><button data-action="wait">レビュー待ちにする</button></div><label>完了の根拠<textarea id="evidence" placeholder="何を、どう確認したかを書いてください"></textarea></label><div class="actions"><button class="primary" data-action="complete">根拠を添えて完了</button><button data-action="stale">古い更新を試す</button></div><p id="feedback" class="result" role="status"></p><div id="completed"></div></section><section class="panel"><h2>仕事の記録</h2><p class="meta">進捗の追記はタスクのversionを変更しません。</p><h3>状態の変更</h3><ol id="events"></ol><h3>進捗</h3><div id="progress"></div></section></div></main><script>
let state;
const $=id=>document.getElementById(id);
function render(s){state=s;$('title').textContent=s.task.title;$('status').textContent=({todo:'未着手',doing:'進行中',waiting:'確認待ち',done:'完了'})[s.task.status]||s.task.status;$('agent').textContent=s.task.assigned_agent||'未設定';$('blocker').textContent=s.task.blocker_summary||'なし';$('version').textContent=String(s.task.version);$('events').replaceChildren(...s.events.map(e=>{const li=document.createElement('li');li.textContent=({created:'作成',updated:'状態を更新',completed:'根拠付きで完了'})[e.type]||e.type;const small=document.createElement('small');small.textContent=`version ${e.task_version} · ${JSON.parse(e.actor).client_id}`;li.append(small);return li;}));$('progress').replaceChildren(...s.progress.map(e=>{const p=document.createElement('p');p.className='progress';p.textContent=e.summary;return p;}));if(!s.progress.length)$('progress').textContent='まだ記録がありません。';$('completed').textContent=s.task.completion_evidence?'完了根拠：'+s.task.completion_evidence.summary:'';document.querySelector('[data-action="stale"]').disabled=s.task.version<2;document.querySelector('[data-action="claim"]').disabled=!['todo','waiting'].includes(s.task.status);document.querySelector('[data-action="wait"]').disabled=s.task.status!=='doing';document.querySelector('[data-action="complete"]').disabled=s.task.status==='done';}
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',async()=>{if(!state)return;const action=b.dataset.action;const input={action,request_id:crypto.randomUUID(),expected_version:action==='stale'?1:state.task.version};if(action==='complete')input.summary=$('evidence').value;document.querySelectorAll('button').forEach(x=>x.disabled=true);try{const response=await fetch('/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(input)});const data=await response.json();if(!response.ok)throw new Error(data.error+'：'+data.message);render(data);$('feedback').className='result';$('feedback').textContent=action==='reset'?'初期状態に戻しました。':'記録を更新しました。';}catch(e){$('feedback').className='result error';$('feedback').textContent=e.message;}finally{document.querySelectorAll('button').forEach(x=>x.disabled=false);render(state);}}));fetch('/state').then(r=>r.json()).then(render).catch(e=>{$('feedback').textContent='起動できませんでした：'+e.message});
</script></html>
